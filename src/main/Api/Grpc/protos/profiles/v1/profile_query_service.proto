syntax = "proto3";

package profiles.v1;

option csharp_namespace = "JacksonVeroneze.GrpcServer.Contracts.Profiles.V1";

import "profiles/v1/profile_types.proto";
import "profiles/v1/pagination_types.proto";

message ListProfilesRequest {
    optional string full_name = 1;
    optional string cpf = 2;
    optional ProfileGender gender = 3;
    optional ProfileStatus status = 4;
    optional PagedRequest pagination = 5;
}

message ListProfilesResponse {
    repeated Profile data = 1;
    PagedResponse pagination = 2;
}

message GetProfileRequest {
    string profile_id = 1;
}

message GetProfileResponse {
    Profile data = 1;
}

service ProfileQueryService {
    rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
    rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
}
