syntax = "proto3";
import "orders/v1/common_types.proto";
import "orders/v1/order_types.proto";

option csharp_namespace = "JacksonVeroneze.NET.GRPCServer.Contracts.Orders.v1";

package orders.v1;

message CreateOrderRequest {
    string customer_id = 1;
    repeated CreateOrderItem items = 2;
}

message CreateOrderItem {
    string product_id = 1;
    string product_name = 2;
    int32 quantity = 3;
    Money unit_price = 4;
}

message CreateOrderResponse {
    Order order = 1;
}

service OrderCommandService {
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
}
